<!doctype html>
<!--
  TRENCHOPS — Redirecionador da raiz

  A landing de captação mora em /cadastro/. Este arquivo existe para que
  quem acessa thetrenchops.com (anúncios antigos, links já divulgados, gente
  digitando o domínio) caia na LP em vez de num 404.

  O redirect é feito em JS para PRESERVAR A QUERYSTRING — sem isso os UTMs
  se perdem no caminho e a atribuição do anúncio morre. O meta refresh abaixo
  é o fallback para quem estiver sem JS, e nele os UTMs realmente se perdem.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trenchops</title>
<link rel="canonical" href="https://thetrenchops.com/cadastro/">
<link rel="icon" type="image/svg+xml" href="assets/logo-trenchops.svg">
<script>
  // replace (e não href) para o botão "voltar" não prender o visitante num laço
  location.replace("cadastro/" + (location.search || "") + (location.hash || ""));
</script>
<meta http-equiv="refresh" content="0;url=cadastro/">
<style>
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;
       background:#0b0f14;color:#e8eef6;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  a{color:#2FB1F8}
</style>
</head>
<body>
  <p>Redirecionando… <a href="cadastro/">clique aqui</a> se nada acontecer.</p>
</body>
</html>
